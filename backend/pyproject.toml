[project]
name = "drp-backend"
version = "0.1.0"
description = "Coordination backend for the Offline-First Disaster Response Platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]  # FastAPI dependencies are function calls in defaults by design

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
